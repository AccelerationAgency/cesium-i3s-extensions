name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: git init -q . && git fetch -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "${{ github.sha }}" && git checkout -q FETCH_HEAD
      - run: node --version && npm ci
      - run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
      - run: npm run typecheck && npm test && npm run sanitize
        env:
          SANITIZE_DENYLIST: ${{ secrets.SANITIZE_DENYLIST }}
      - run: npm run build
  worker:
    runs-on: ubuntu-latest
    steps:
      - run: git init -q . && git fetch -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "${{ github.sha }}" && git checkout -q FETCH_HEAD
      - run: node --version && npm ci
      - run: |
          out="$(mktemp -d)"
          node worker/build-worker.mjs --out "$out"
          node worker/verify-worker.mjs "$out/decodeI3S.js"
