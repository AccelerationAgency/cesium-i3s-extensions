version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Pinned exactly — the worker patch is hand-derived against one specific
      # decodeI3S.js source (see CONTRIBUTING.md § Bumping the Cesium version).
      - dependency-name: "cesium"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@cesium/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Majors are migrations, not routine bumps: they often need a matching
      # major of a peer (e.g. a Vite plugin that requires a newer Vite), which a
      # single-package PR can't satisfy. Do them by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # esbuild is 0.x: a minor bump can break the worker bundle.
      - dependency-name: "esbuild"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
